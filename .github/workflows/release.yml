name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: seahorse-linux-amd64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: seahorse-windows-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: seahorse-macos-arm64
          - target: x86_64-apple-darwin
            os: macos-13
            artifact: seahorse-macos-amd64

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: seahorse
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: seahorse

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd seahorse/target/${{ matrix.target }}/release
          tar czf ${{ matrix.artifact }}.tar.gz seahorse
          mv ${{ matrix.artifact }}.tar.gz ../../../../

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd seahorse/target/${{ matrix.target }}/release
          7z a ${{ matrix.artifact }}.zip seahorse.exe
          mv ${{ matrix.artifact }}.zip ../../../../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: seahorse-*.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
