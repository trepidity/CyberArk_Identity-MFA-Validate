[package]
name = "seahorse"
version = "0.1.0"
edition = "2021"
description = "BSWH MFA Validate - OATH/SAML validation against CyberArk Identity"

[[bin]]
name = "seahorse"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
axum = "0.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# XML
quick-xml = { version = "0.37", features = ["serialize"] }

# Crypto
openssl = { version = "0.10", features = ["vendored"] }
base64 = "0.22"

# Utilities
urlencoding = "2"
open = "5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
